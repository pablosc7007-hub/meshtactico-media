const basePos = people.map(p => p.position.clone());
const LG = new THREE.Vector3(.06, .75, .22), LC = new THREE.Vector3(.08, .45, .8);

  node.position.copy(nA).add(V(0, Math.sin(t * 2) * .03 - ko * .6, 0)); nodeB.position.copy(nB).add(V(0, Math.sin(t * 2 + 1) * .03 - ko * .6, 0));
